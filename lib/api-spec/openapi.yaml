openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: knowledge
    description: Teamcenter knowledge base and RAG operations
paths:
  /auth/login:
    post:
      operationId: login
      tags: [knowledge]
      summary: Verify the admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Password verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Wrong password
        "503":
          description: Password access has not been configured
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stats:
    get:
      operationId: getStats
      tags: [knowledge]
      summary: Get knowledge base stats
      responses:
        "200":
          description: Current indexing and corpus stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeStats"
  /articles:
    get:
      operationId: listArticles
      tags: [knowledge]
      summary: List indexed knowledge articles
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching indexed articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
    post:
      operationId: createArticle
      tags: [knowledge]
      summary: Add a knowledge article manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "409":
          description: An article with the same URL already exists
  /articles/count:
    get:
      operationId: getArticleCount
      tags: [knowledge]
      summary: Get total indexed article count
      responses:
        "200":
          description: Total indexed articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleCount"
  /admin/articles/sample:
    get:
      operationId: getAdminArticleSample
      tags: [knowledge]
      summary: Get a random sample of indexed articles for admin review
      parameters:
        - name: count
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Random article sample
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminArticleSample"
        "400":
          description: Invalid sample size
  /admin/articles/clean-all:
    post:
      operationId: cleanAllAdminArticles
      tags: [knowledge]
      summary: Remove navigation artifacts from all indexed articles
      responses:
        "200":
          description: Cleanup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleCleanupResponse"
  /articles/pdf:
    post:
      operationId: importPdfArticle
      tags: [knowledge]
      summary: Extract and save a PDF as a knowledge article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdfArticleInput"
      responses:
        "201":
          description: PDF article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
  /articles/bulk:
    post:
      operationId: bulkImportArticles
      tags: [knowledge]
      summary: Import a batch of knowledge articles
      security:
        - bulkImportBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/BulkArticleImportArray"
                - $ref: "#/components/schemas/BulkArticleImportInput"
      responses:
        "201":
          description: Bulk import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResponse"
        "401":
          description: Missing or invalid bulk import bearer token
        "503":
          description: Bulk import access is not configured
  /chat:
    post:
      operationId: chat
      tags: [knowledge]
      summary: Ask the Teamcenter RAG assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Grounded assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
  /community/questions:
    post:
      operationId: submitCommunityQuestion
      tags: [knowledge]
      summary: Submit a question for Teamcenter expert follow-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityQuestionInput"
      responses:
        "201":
          description: Community question submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityQuestionResponse"
  /feedback:
    post:
      operationId: submitAnswerFeedback
      tags: [knowledge]
      summary: Rate an assistant answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
  /admin/community/questions:
    get:
      operationId: listCommunityQuestions
      tags: [knowledge]
      summary: List community questions for admin review
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, answered, all]
            default: pending
      responses:
        "200":
          description: Community question queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityQuestion"
  /admin/community/questions/{id}/answer:
    post:
      operationId: answerCommunityQuestion
      tags: [knowledge]
      summary: Answer a community question and add it to the corpus
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityAnswerInput"
      responses:
        "200":
          description: Answered community question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityQuestion"
        "404":
          description: Question not found
  /admin/feedback/stats:
    get:
      operationId: getFeedbackStats
      tags: [knowledge]
      summary: Get answer feedback statistics
      responses:
        "200":
          description: Feedback statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackStats"
components:
  securitySchemes:
    bulkImportBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    LoginInput:
      type: object
      required: [password, area]
      properties:
        password: { type: string, minLength: 1, maxLength: 200 }
        area:
          type: string
          enum: [admin]
    AuthSession:
      type: object
      required: [authenticated, area]
      properties:
        authenticated: { type: boolean }
        area:
          type: string
          enum: [admin]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Article:
      type: object
      required: [id, title, content, category, tags, url]
      properties:
        id: { type: number }
        title: { type: string }
        content: { type: string }
        category: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        url: { type: ["string", "null"] }
    ArticleInput:
      type: object
      required: [title, content, tags]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        content: { type: string, minLength: 1, maxLength: 1000000 }
        category: { type: ["string", "null"], maxLength: 120 }
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 80 }
        url: { type: ["string", "null"], maxLength: 2000 }
    PdfArticleInput:
      type: object
      required: [filename, data]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        data:
          type: string
          description: Base64-encoded PDF bytes without the data URL prefix
        title: { type: ["string", "null"], maxLength: 500 }
        category: { type: ["string", "null"], maxLength: 120 }
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 80 }
        url: { type: ["string", "null"], maxLength: 2000 }
    BulkImportResponse:
      type: object
      required: [imported, skipped]
      properties:
        imported: { type: number }
        skipped: { type: number }
    BulkArticleImportInput:
      type: object
      required: [articles]
      properties:
        articles:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/ArticleInput"
    BulkArticleImportArray:
      type: array
      maxItems: 500
      items:
        $ref: "#/components/schemas/ArticleInput"
    ArticleCount:
      type: object
      required: [count]
      properties:
        count: { type: number }
    AdminArticleSample:
      type: object
      required: [id, title, content, url]
      properties:
        id: { type: number }
        title: { type: string }
        content: { type: string, maxLength: 200 }
        url:
          type: [string, "null"]
    ArticleCleanupResponse:
      type: object
      required: [scanned, cleaned]
      properties:
        scanned: { type: number }
        cleaned: { type: number }
    KnowledgeStats:
      type: object
      required: [totalArticles, indexedArticles, categories]
      properties:
        totalArticles: { type: number }
        indexedArticles: { type: number }
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
    CategoryCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: number }
    ChatInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
        sessionId: { type: ["string", "null"] }
        imageData:
          type: ["string", "null"]
          description: Base64-encoded PNG or JPEG image without the data URL prefix
        imageMimeType:
          type: ["string", "null"]
          enum: [image/png, image/jpeg, null]
    ChatSource:
      type: object
      required: [id, title, url, category, score]
      properties:
        id: { type: number }
        title: { type: string }
        url: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        score: { type: number }
    ChatVideo:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url: { type: string }
    ChatReply:
      type: object
      required: [answer, sources, videos, sessionId, communityHandoff, responseId]
      properties:
        answer: { type: string }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ChatSource"
        videos:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/ChatVideo"
        sessionId: { type: string }
        communityHandoff: { type: boolean }
        responseId: { type: string }
    CommunityQuestionInput:
      type: object
      required: [question, language]
      properties:
        question: { type: string, minLength: 1, maxLength: 10000 }
        screenshotRef: { type: ["string", "null"], maxLength: 500 }
        language: { type: string, minLength: 2, maxLength: 20 }
    CommunityQuestionResponse:
      type: object
      required: [id, status, confirmation]
      properties:
        id: { type: number }
        status: { type: string, enum: [pending] }
        confirmation: { type: string }
    CommunityQuestion:
      type: object
      required: [id, question, screenshotRef, language, status, answer, answeredAt, createdAt]
      properties:
        id: { type: number }
        question: { type: string }
        screenshotRef: { type: ["string", "null"] }
        language: { type: string }
        status: { type: string, enum: [pending, answered] }
        answer: { type: ["string", "null"] }
        answeredAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    CommunityAnswerInput:
      type: object
      required: [answer]
      properties:
        answer: { type: string, minLength: 1, maxLength: 1000000 }
    FeedbackInput:
      type: object
      required: [responseId, rating]
      properties:
        responseId: { type: string, minLength: 1, maxLength: 100 }
        sessionId: { type: ["string", "null"], maxLength: 200 }
        rating: { type: string, enum: [positive, negative] }
        comment: { type: ["string", "null"], maxLength: 200 }
    FeedbackResponse:
      type: object
      required: [id, recorded]
      properties:
        id: { type: number }
        recorded: { type: boolean }
    FeedbackStats:
      type: object
      required: [totalResponses, positivePercentage, recentNegative]
      properties:
        totalResponses: { type: number }
        positivePercentage: { type: number }
        recentNegative:
          type: array
          items:
            type: object
            required: [id, responseId, comment, createdAt]
            properties:
              id: { type: number }
              responseId: { type: string }
              comment: { type: string }
              createdAt: { type: string, format: date-time }

