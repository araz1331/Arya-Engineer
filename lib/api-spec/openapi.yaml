openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: knowledge
    description: Teamcenter knowledge base and RAG operations
  - name: scraper
    description: Siemens GTAC scraper operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stats:
    get:
      operationId: getStats
      tags: [knowledge]
      summary: Get knowledge base stats
      responses:
        "200":
          description: Current indexing and corpus stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeStats"
  /articles:
    get:
      operationId: listArticles
      tags: [knowledge]
      summary: List indexed knowledge articles
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching indexed articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
    post:
      operationId: createArticle
      tags: [knowledge]
      summary: Add a knowledge article manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "409":
          description: An article with the same URL already exists
  /articles/pdf:
    post:
      operationId: importPdfArticle
      tags: [knowledge]
      summary: Extract and save a PDF as a knowledge article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdfArticleInput"
      responses:
        "201":
          description: PDF article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
  /articles/bulk:
    post:
      operationId: bulkImportArticles
      tags: [knowledge]
      summary: Import articles from a local scraper
      security:
        - scraperBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkArticleImportInput"
      responses:
        "201":
          description: Bulk import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResponse"
        "401":
          description: Missing or invalid scraper bearer token
        "503":
          description: SCRAPER_SECRET is not configured
  /chat:
    post:
      operationId: chat
      tags: [knowledge]
      summary: Ask the Teamcenter RAG assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Grounded assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
  /scrape/start:
    post:
      operationId: startScrape
      tags: [scraper]
      summary: Start or resume the Siemens GTAC scraper
      responses:
        "202":
          description: Scraper accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeStatus"
  /scrape/seed:
    post:
      operationId: seedScrapeUrls
      tags: [scraper]
      summary: Add public article URLs to the scraper queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeedUrlsInput"
      responses:
        "201":
          description: Seed URL import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedUrlsResponse"
  /scrape/status:
    get:
      operationId: getScrapeStatus
      tags: [scraper]
      summary: Get scraper progress
      responses:
        "200":
          description: Scraper progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeStatus"
  /scrape/debug:
    get:
      operationId: debugScrape
      tags: [scraper]
      summary: Test GTAC access with the current scraper session
      responses:
        "200":
          description: GTAC response diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeDebug"
components:
  securitySchemes:
    scraperBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Article:
      type: object
      required: [id, title, content, category, tags, url, scrapedAt, sourceUpdatedAt]
      properties:
        id: { type: number }
        title: { type: string }
        content: { type: string }
        category: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        url: { type: ["string", "null"] }
        scrapedAt: { type: string, format: date-time }
        sourceUpdatedAt: { type: ["string", "null"], format: date-time }
    ArticleInput:
      type: object
      required: [title, content, tags]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        content: { type: string, minLength: 1, maxLength: 1000000 }
        category: { type: ["string", "null"], maxLength: 120 }
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 80 }
        url: { type: ["string", "null"], maxLength: 2000 }
    PdfArticleInput:
      type: object
      required: [filename, data]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        data:
          type: string
          description: Base64-encoded PDF bytes without the data URL prefix
        title: { type: ["string", "null"], maxLength: 500 }
        category: { type: ["string", "null"], maxLength: 120 }
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 80 }
        url: { type: ["string", "null"], maxLength: 2000 }
    BulkImportResponse:
      type: object
      required: [imported, skipped]
      properties:
        imported: { type: number }
        skipped: { type: number }
    BulkArticleImportInput:
      type: object
      required: [articles]
      properties:
        articles:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/ScraperArticleInput"
    ScraperArticleInput:
      type: object
      required: [title, content, category, tags, url]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        content: { type: string, minLength: 1, maxLength: 1000000 }
        category: { type: string, maxLength: 120 }
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 80 }
        url: { type: string, minLength: 1, maxLength: 2000 }
    KnowledgeStats:
      type: object
      required: [totalArticles, indexedArticles, lastScraped, categories]
      properties:
        totalArticles: { type: number }
        indexedArticles: { type: number }
        lastScraped: { type: ["string", "null"], format: date-time }
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
    CategoryCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: number }
    ChatInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
        sessionId: { type: ["string", "null"] }
        imageData:
          type: ["string", "null"]
          description: Base64-encoded PNG or JPEG image without the data URL prefix
        imageMimeType:
          type: ["string", "null"]
          enum: [image/png, image/jpeg, null]
    ChatSource:
      type: object
      required: [id, title, url, category, score]
      properties:
        id: { type: number }
        title: { type: string }
        url: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        score: { type: number }
    ChatReply:
      type: object
      required: [answer, sources, sessionId]
      properties:
        answer: { type: string }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ChatSource"
        sessionId: { type: string }
    ScrapeStatus:
      type: object
      required: [status, currentPage, totalPages, articlesScraped, lastRun, lastError, phase]
      properties:
        status:
          type: string
          enum: [idle, running, complete, error]
        currentPage: { type: number }
        totalPages: { type: number }
        articlesScraped: { type: number }
        lastRun: { type: ["string", "null"], format: date-time }
        lastError: { type: ["string", "null"] }
        phase:
          type: string
          enum: [discover, content]
    ScrapeDebug:
      type: object
      required: [statusCode, responseHeaders, bodyPreview]
      properties:
        statusCode: { type: number }
        responseHeaders:
          type: object
          additionalProperties: { type: string }
        bodyPreview: { type: string }
    SeedUrlsInput:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          minItems: 1
          maxItems: 5000
          items: { type: string, minLength: 1, maxLength: 2000 }
    SeedUrlsResponse:
      type: object
      required: [added, skipped, invalid]
      properties:
        added: { type: number }
        skipped: { type: number }
        invalid: { type: number }

